<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="lockBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0307" />
      <stop offset="50%" stop-color="#0D0003" />
      <stop offset="100%" stop-color="#050001" />
    </linearGradient>

    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bottomFadeLock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(10,0,0,0)" />
      <stop offset="70%" stop-color="rgba(10,0,0,0.8)" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#lockBg)" />

  <!-- Prison Control Room Metal Architecture Walls -->
  <rect x="50" y="40" width="300" height="500" fill="#121216" stroke="#2A2A35" stroke-width="4" />
  <text x="70" y="90" fill="#FF1744" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="3">CONTROL ROOM</text>
  <text x="70" y="140" fill="#666" font-family="'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="2">CELL BLOCK A</text>

  <!-- Red Neon Vertical Pillars -->
  <line x1="420" y1="0" x2="420" y2="700" stroke="#FF0033" stroke-width="8" filter="url(#redGlow)" />
  <line x1="440" y1="0" x2="440" y2="700" stroke="#FF1744" stroke-width="4" filter="url(#redGlow)" />

  <!-- Contestants Grid Neon Box Frame (Right side) -->
  <g transform="translate(680, 50)">
    <!-- Neon Outer Red Border Frame -->
    <rect x="0" y="0" width="460" height="480" rx="16" fill="#150206" stroke="#FF0033" stroke-width="6" filter="url(#redGlow)" />

    <!-- 4x4 Contestant Cell Grid -->
    <!-- Row 1 -->
    <rect x="20" y="20" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="125" y="20" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="230" y="20" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="335" y="20" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />

    <!-- Row 2 -->
    <rect x="20" y="125" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="125" y="125" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="230" y="125" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="335" y="125" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />

    <!-- Row 3 -->
    <rect x="20" y="230" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="125" y="230" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="230" y="230" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />
    <rect x="335" y="230" width="90" height="90" rx="8" fill="#2A0812" stroke="#FF1744" stroke-width="2" />

    <!-- Pink/Black Uniform Contestant Silhouettes inside Grid -->
    <g fill="#E91E63">
      <circle cx="65" cy="50" r="18" fill="#FFCDD2" />
      <path d="M 45,75 L 85,75 L 90,110 L 40,110 Z" />

      <circle cx="170" cy="50" r="18" fill="#FFCDD2" />
      <path d="M 150,75 L 190,75 L 195,110 L 145,110 Z" />

      <circle cx="275" cy="50" r="18" fill="#FFCDD2" />
      <path d="M 255,75 L 295,75 L 300,110 L 250,110 Z" />

      <circle cx="380" cy="50" r="18" fill="#FFCDD2" />
      <path d="M 360,75 L 400,75 L 405,110 L 355,110 Z" />
    </g>
  </g>

  <!-- Hosts in Black (Front) -->
  <g transform="translate(560, 240)">
    <!-- Kangana Ranaut in Dark Outfit -->
    <circle cx="60" cy="60" r="30" fill="#FFE0B2" />
    <path d="M 20,50 C 20,10 100,10 100,50 C 105,110 15,110 20,50 Z" fill="#111" />
    <path d="M 25,100 L 95,100 L 110,260 L 10,260 Z" fill="#0A0A0A" stroke="#333" stroke-width="2" />

    <!-- Karan Kundrra / Co-host in Black Suit -->
    <g transform="translate(90, -20)">
      <circle cx="60" cy="60" r="32" fill="#FFCC80" />
      <path d="M 25,50 C 25,15 95,15 95,50 L 95,65 C 95,95 25,95 25,65 Z" fill="#1C1C1C" />
      <path d="M 20,105 L 100,105 L 115,280 L 5,280 Z" fill="#151515" />
    </g>
  </g>

  <!-- Dark Bottom Gradient -->
  <rect y="300" width="1200" height="400" fill="url(#bottomFadeLock)" />

  <!-- Metallic Red LOCK UPP Title Badge -->
  <g transform="translate(100, 420)" filter="url(#redGlow)">
    <rect width="460" height="110" rx="18" fill="#0A0204" stroke="#FF0033" stroke-width="5" />
    <text x="40" y="76" font-family="'Inter', sans-serif" font-weight="900" font-size="60" fill="#FFFFFF" letter-spacing="4">LOCK UPP</text>
  </g>
</svg>
