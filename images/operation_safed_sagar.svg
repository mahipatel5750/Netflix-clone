<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="kargilSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3C72" />
      <stop offset="50%" stop-color="#2A5298" />
      <stop offset="100%" stop-color="#4A6572" />
    </linearGradient>

    <linearGradient id="snowPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CFD8DC" />
      <stop offset="100%" stop-color="#37474F" />
    </linearGradient>

    <linearGradient id="bottomFadeOps" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(10,15,25,0)" />
      <stop offset="65%" stop-color="rgba(10,15,25,0.8)" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <filter id="shadowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="700" fill="url(#kargilSky)" />

  <!-- Fighter Jet Trails (White Smoke lines) -->
  <path d="M 1200,80 L 700,280" stroke="#FFFFFF" stroke-width="6" opacity="0.8" stroke-dasharray="10,4" />
  <path d="M 1200,120 L 750,300" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-dasharray="8,4" />

  <!-- Fighter Jet Silhouette in Sky -->
  <g transform="translate(950, 120) scale(0.6) rotate(-25)">
    <polygon points="0,0 80,-20 180,-5 120,40 40,30" fill="#263238" stroke="#ECEFF1" stroke-width="2" />
    <!-- Wing -->
    <polygon points="60,-15 140,-90 120,-10" fill="#37474F" />
  </g>

  <!-- Snowy Mountain Ranges (Kargil Peaks) -->
  <polygon points="0,520 250,220 500,480 800,180 1050,450 1200,280 1200,700 0,700" fill="url(#snowPeak)" />

  <!-- Air Force Pilots / Officers Collage Group (Golden Arrows Squadron) -->
  <g transform="translate(640, 100)">
    <!-- Main Pilot (Middle) in Blue Air Force Uniform -->
    <g transform="translate(100, 40)">
      <circle cx="65" cy="65" r="40" fill="#FFCC80" />
      <!-- Mustache & Cap -->
      <path d="M 35,55 C 35,15 95,15 95,55 Z" fill="#1565C0" />
      <rect x="30" y="55" width="70" height="8" fill="#1A237E" />
      <path d="M 45,75 Q 65,90 85,75" stroke="#212121" stroke-width="6" fill="none" />
      <!-- Air Force Uniform Jacket -->
      <path d="M 15,110 L 115,110 L 130,360 L 0,360 Z" fill="#0D47A1" />
      <!-- Air Force Badges -->
      <rect x="25" y="140" width="30" height="15" fill="#FF9800" />
      <circle cx="85" cy="150" r="10" fill="#FFD54F" />
    </g>

    <!-- Left Pilot -->
    <g transform="translate(0, 120)">
      <circle cx="50" cy="50" r="32" fill="#FFE0B2" />
      <path d="M 20,40 C 20,10 80,10 80,40 Z" fill="#1E88E5" />
      <path d="M 10,90 L 90,90 L 100,300 L 0,300 Z" fill="#1565C0" />
    </g>

    <!-- Right Pilot -->
    <g transform="translate(200, 130)">
      <circle cx="50" cy="50" r="32" fill="#FFCC80" />
      <!-- Turban/Cap -->
      <path d="M 18,35 C 18,-5 82,-5 82,35 Z" fill="#1A237E" />
      <path d="M 10,90 L 90,90 L 100,300 L 0,300 Z" fill="#1565C0" />
    </g>
  </g>

  <!-- Dark Bottom Gradient Overlay -->
  <rect y="320" width="1200" height="380" fill="url(#bottomFadeOps)" />

  <!-- White Bold Military Title Artwork "OPERATION SAFED SAGAR" -->
  <g transform="translate(100, 430)" filter="url(#shadowWhite)">
    <!-- O P E R A T I O N -->
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="12">OPERAT</text>
    <!-- Tricolor Dot for I O N -->
    <circle cx="165" cy="-7" r="9" fill="#FF9933" />
    <circle cx="165" cy="-7" r="6" fill="#FFFFFF" />
    <circle cx="165" cy="-7" r="3" fill="#138808" />
    <text x="180" y="0" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="12">ION</text>

    <!-- SAFED SAGAR -->
    <text x="0" y="55" font-family="'Inter', sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" letter-spacing="2">SAFED SAGAR</text>

    <!-- Subtitle -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#CCCCCC" letter-spacing="4">THE UNTOLD STORY OF THE KARGIL WAR</text>
  </g>
</svg>
