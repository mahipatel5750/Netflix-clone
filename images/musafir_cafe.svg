<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <!-- Background Mountain Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB" />
      <stop offset="40%" stop-color="#F8B500" />
      <stop offset="70%" stop-color="#E55D87" />
      <stop offset="100%" stop-color="#5CB85C" />
    </linearGradient>

    <!-- Mountain Layers -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A6073" />
      <stop offset="100%" stop-color="#16222A" />
    </linearGradient>

    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B6CB7" />
      <stop offset="100%" stop-color="#182E40" />
    </linearGradient>

    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B86E5" />
      <stop offset="100%" stop-color="#36D1DC" />
    </linearGradient>

    <!-- Dark Fade Overlay -->
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(20,20,20,0)" />
      <stop offset="60%" stop-color="rgba(20,20,20,0.6)" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="700" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="600" cy="220" r="140" fill="#FFF7D6" opacity="0.85" />

  <!-- Far Mountains -->
  <polygon points="0,500 200,280 450,480 750,220 1000,490 1200,320 1200,700 0,700" fill="url(#mountainGrad2)" opacity="0.8" />

  <!-- Near Mountains -->
  <polygon points="0,550 300,340 600,520 850,310 1200,540 1200,700 0,700" fill="url(#mountainGrad1)" />

  <!-- Green Hills -->
  <path d="M 0,520 Q 300,450 600,530 T 1200,500 L 1200,700 L 0,700 Z" fill="#2E7D32" opacity="0.9" />

  <!-- Village Cottages in Hills -->
  <g fill="#5D4037" opacity="0.85">
    <rect x="250" y="470" width="40" height="30" />
    <polygon points="245,470 270,445 295,470" fill="#C62828" />

    <rect x="820" y="460" width="50" height="35" />
    <polygon points="815,460 845,430 875,460" fill="#B71C1C" />
  </g>

  <!-- 3 Lead Characters Silhouette Representations (Sudha, Chander, Preeti) -->
  <!-- Left Female (Sudha in Red sweater) -->
  <g transform="translate(480, 220)">
    <circle cx="50" cy="80" r="32" fill="#E57373" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))" />
    <!-- Hair -->
    <path d="M 18,80 C 18,40 82,40 82,80 C 85,130 15,130 18,80 Z" fill="#1C1C1C" />
    <!-- Torso (Red Top) -->
    <path d="M 25,120 L 75,120 L 85,280 L 15,280 Z" fill="#C62828" />
  </g>

  <!-- Male Center (Chander smiling in Flannel Shirt) -->
  <g transform="translate(620, 140)">
    <circle cx="60" cy="80" r="36" fill="#FFCC80" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))" />
    <!-- Beard & Hair -->
    <path d="M 22,70 C 22,25 98,25 98,70 L 98,85 C 98,125 22,125 22,85 Z" fill="#212121" />
    <!-- Plaid Shirt -->
    <path d="M 15,125 L 105,125 L 120,340 L 0,340 Z" fill="#D32F2F" />
    <!-- Plaid Stripes -->
    <path d="M 40,125 L 40,340 M 80,125 L 80,340 M 0,180 L 120,180 M 0,250 L 120,250" stroke="#1976D2" stroke-width="6" />
  </g>

  <!-- Right Female (Preeti in pastel sweater) -->
  <g transform="translate(760, 200)">
    <circle cx="50" cy="80" r="30" fill="#FFE0B2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))" />
    <!-- Long Hair -->
    <path d="M 15,75 C 15,35 85,35 85,75 C 90,140 10,140 15,75 Z" fill="#1C1C1C" />
    <!-- Pastel Sweater -->
    <path d="M 22,115 L 78,115 L 88,300 L 12,300 Z" fill="#80CBC4" />
  </g>

  <!-- Dark Bottom Vignette -->
  <rect y="300" width="1200" height="400" fill="url(#bottomFade)" />

  <!-- Cursive Title "Musafir Cafe" -->
  <text x="180" y="480" font-family="'Dancing Script', cursive, 'Georgia', serif" font-size="95" font-weight="bold" fill="#FFE4BC" filter="url(#shadow)">Musafir Cafe</text>
</svg>
