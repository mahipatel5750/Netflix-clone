<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="courtBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D4037" />
      <stop offset="50%" stop-color="#3E2723" />
      <stop offset="100%" stop-color="#1B0000" />
    </linearGradient>

    <linearGradient id="stoneArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>

    <linearGradient id="bottomFadeIkka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,10,10,0)" />
      <stop offset="65%" stop-color="rgba(15,10,10,0.85)" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <filter id="distress" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#courtBg)" />

  <!-- Bombay High Court Heritage Stone Arch Structure -->
  <path d="M 400,0 L 400,280 Q 700,120 1000,280 L 1000,0 Z" fill="url(#stoneArch)" stroke="#3E2723" stroke-width="6" />
  <path d="M 450,0 L 450,240 Q 700,100 950,240 L 950,0 Z" fill="#3E2723" />

  <!-- BOMBAY HIGH COURT Sign Board -->
  <g transform="translate(620, 80) rotate(5)">
    <rect x="0" y="0" width="320" height="50" fill="#FFD700" stroke="#5D4037" stroke-width="4" />
    <text x="160" y="34" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#3E2723" letter-spacing="3">BOMBAY HIGH COURT</text>
  </g>

  <!-- Balcony Railing -->
  <rect x="420" y="320" width="600" height="40" fill="#6D4C41" stroke="#3E2723" stroke-width="4" />
  <line x1="420" y1="340" x2="1020" y2="340" stroke="#3E2723" stroke-width="6" />

  <!-- Advocate Sunny Deol in Lawyer Black Robes leaning over Balcony -->
  <g transform="translate(560, 140)">
    <!-- Face & Beard -->
    <circle cx="70" cy="70" r="38" fill="#FFCC80" />
    <!-- Beard & Hair -->
    <path d="M 32,55 C 32,15 108,15 108,55 L 108,80 C 108,120 32,120 32,80 Z" fill="#212121" />
    <!-- Lawyer White Collar Tie -->
    <polygon points="62,110 70,140 78,110" fill="#FFFFFF" />
    <polygon points="54,110 62,145 70,110" fill="#FFFFFF" />
    <!-- Lawyer Black Robe / Gown -->
    <path d="M 15,115 L 125,115 L 145,360 L -5,360 Z" fill="#111111" stroke="#333" stroke-width="2" />
  </g>

  <!-- Dark Bottom Gradient -->
  <rect y="300" width="1200" height="400" fill="url(#bottomFadeIkka)" />

  <!-- Heavy Distressed White Stencil Title "IKKA" -->
  <g transform="translate(110, 440)" filter="url(#distress)">
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" letter-spacing="8">IKKA</text>
  </g>
</svg>
