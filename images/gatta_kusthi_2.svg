<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="festiveSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="50%" stop-color="#92FE9D" />
      <stop offset="100%" stop-color="#E0C3FC" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B81D24" />
      <stop offset="50%" stop-color="#7A0A0A" />
      <stop offset="100%" stop-color="#3A0000" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bottomFadeGatta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,15,20,0)" />
      <stop offset="65%" stop-color="rgba(15,15,20,0.7)" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- Bright Festive Sky -->
  <rect width="1200" height="700" fill="url(#festiveSky)" />

  <!-- Colorful Festive Bunting Flags (Triangle Garlands) -->
  <path d="M 0,40 L 1200,120" stroke="#FF5722" stroke-width="3" stroke-dasharray="2,2" />
  <polygon points="50,45 80,47 65,90" fill="#E50914" />
  <polygon points="120,50 150,52 135,95" fill="#FFEB3B" />
  <polygon points="190,55 220,57 205,100" fill="#00E676" />
  <polygon points="260,60 290,62 275,105" fill="#FF4081" />
  <polygon points="330,65 360,67 345,110" fill="#AA00FF" />
  <polygon points="400,70 430,72 415,115" fill="#FF9100" />
  <polygon points="470,75 500,77 485,120" fill="#00B0FF" />
  <polygon points="540,80 570,82 555,125" fill="#E50914" />
  <polygon points="610,85 640,87 625,130" fill="#FFEB3B" />
  <polygon points="680,90 710,92 695,135" fill="#00E676" />

  <!-- Sun Rays Radial Effect -->
  <circle cx="700" cy="200" r="350" fill="#FFFFFF" opacity="0.25" />

  <!-- Wrestling Couple Silhouette (Wife lifting/throwing husband in air) -->
  <!-- Wife in Red Saree holding husband -->
  <g transform="translate(620, 220)">
    <!-- Wife Body (Red Saree) -->
    <path d="M 30,120 Q 80,90 120,130 L 140,320 L 10,320 Z" fill="#D50000" />
    <path d="M 40,140 Q 90,160 130,120" stroke="#FFD700" stroke-width="12" fill="none" />
    <!-- Wife Head -->
    <circle cx="80" cy="80" r="32" fill="#FFCC80" />
    <path d="M 48,70 C 48,30 112,30 112,70 C 115,120 45,120 48,70 Z" fill="#212121" />

    <!-- Husband Thrown Flying Upside Down in Air -->
    <g transform="translate(-80, -180) rotate(-45)">
      <!-- Body (Red Wrestling Singlet) -->
      <path d="M 20,40 L 90,40 L 80,180 L 30,180 Z" fill="#B71C1C" />
      <!-- Head -->
      <circle cx="55" cy="-10" r="30" fill="#FFE0B2" />
      <path d="M 25,-20 C 25,-55 85,-55 85,-20 Z" fill="#1C1C1C" />
      <!-- Legs flying in air -->
      <line x1="30" y1="180" x2="-20" y2="280" stroke="#FFE0B2" stroke-width="24" stroke-linecap="round" />
      <line x1="80" y1="180" x2="130" y2="260" stroke="#FFE0B2" stroke-width="24" stroke-linecap="round" />
    </g>
  </g>

  <!-- Dark Bottom Fade -->
  <rect y="320" width="1200" height="380" fill="url(#bottomFadeGatta)" />

  <!-- Golden Shield Emblem Logo "GATTA KUSTHI PART 2 ROUND" -->
  <g transform="translate(120, 410)" filter="url(#goldGlow)">
    <!-- Octagonal Gold & Red Shield -->
    <polygon points="110,0 200,0 240,40 240,140 155,185 70,140 70,40" fill="url(#shieldGrad)" stroke="#FFD700" stroke-width="6" />
    <text x="155" y="65" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFD700" letter-spacing="1">GATTA</text>
    <text x="155" y="98" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFD700" letter-spacing="1">KUSTHI</text>
    <!-- Part 2 Badge -->
    <rect x="100" y="115" width="110" height="28" rx="6" fill="#E50914" stroke="#FFF" stroke-width="1.5" />
    <text x="155" y="134" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="1">PART 2 ROUND</text>
  </g>
</svg>
